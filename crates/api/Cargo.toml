[package]
name = "quagorious_api"
version = "0.1.0"
edition = "2024"
description = "Quagorious HTTP + live-events client (platform independent)"

[dependencies]
quagorious_card = { path = "../card" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
ureq = { version = "2", features = ["json", "tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
