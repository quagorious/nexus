# Builds the addon DLL when a `v*` tag is pushed and then publishes a GitHub
# release for that tag with the DLL and checksums.txt (SHA-256) attached.
#
# The release is created only after the build, so it never exists without
# its DLL: Nexus caches the release list, and a client that sees a release
# without a .dll asset reports "up to date" until that cache expires.
#
# Release flow: bump `version` in Cargo.toml, commit, push, then
# `git tag v0.3.0 && git push origin v0.3.0`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows DLL
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag '$TAG' does not match Cargo.toml version '$version' (expected 'v$version')."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p quagorious_share

      - name: Test card crate
        run: cargo test --release --locked -p quagorious_card

      - name: Collect DLL and checksums
        run: |
          mkdir dist
          cp "target/$TARGET/release/quagorious_share.dll" dist/
          cd dist
          sha256sum quagorious_share.dll > checksums.txt
          cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run for an existing release only replaces its files.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/quagorious_share.dll dist/checksums.txt --clobber
          else
            # The AI notice goes on top; the generated notes are appended.
            gh release create "$TAG" dist/quagorious_share.dll dist/checksums.txt \
              --title "$TAG" --notes-file .github/AI_NOTICE.md --generate-notes --verify-tag
          fi
